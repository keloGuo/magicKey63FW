ploadDataLen+uploadDataOffset>=document.getElementById('file').files[0].size)obj.over=1;temp=JSON.stringify(obj);webDataRequest("webFileUpdatePpakgEnter",temp);uploadStatie=2;uploadBusy=1;uploadCount+=1;progressFunction(uploadCount)}else if(uploadStatie==2){var temp=fileLoad(uploadCount*chunkSize);uploadCheckSumState=0;checkSumProcess(uploadCount*chunkSize);if(temp==null){clearInterval(timer);var time=document.getElementById("time");time.innerHTML="上传完成";return}webDataRequest("updateP",temp);uploadStatie=1;console.log("updata file send data  ",uploadCount)}else if(uploadStatie==0){uploadCount=0;var fileObj=document.getElementById('file').files[0];var temp='{"size":0,"type":0}';var obj=JSON.parse(temp);obj.size=fileObj.size;var fileName=fileObj.name;console.log("fileName",fileName.length,fileName);if(fileName.length>5){var temp=fileName.slice(fileName.length-5,fileName.length);var temp1=fileName.slice(fileName.length-4,fileName.length);console.log("fileName",fileName,temp,temp1);if(temp==".html")obj.type=1;if(temp1==".gif")obj.type=2}if(obj.type==0){uploadStatie=0;uploadCheckSum=0;uploadCount=0;uploadBusy=0;uploadErro=0;timeOutCount=0;uploadStatie=0;var time=document.getElementById("time");time.innerHTML="文件类型错误";return}temp=JSON.stringify(obj);var progressBar=document.getElementById("progressBar");progressBar.max=((fileObj.size%chunkSize==0)?fileObj.size/chunkSize:fileObj.size/chunkSize+1)-1;webDataRequest("updateStart",temp);uploadStatie=2;uploadBusy=1;timer=self.setInterval(uploadFileTimerHandle,100);var time=document.getElementById("time");time.innerHTML="文件上传中 . . . ";console.log("updata file start ")}else if(uploadStatie==3){uploadStatie=0;uploadCheckSum=0;uploadCount=0;uploadBusy=0;uploadErro=0;timeOutCount=0;uploadStatie=0;clearInterval(timer)}}function UpladFile(){uploadStatie=0;uploadFileTimerHandle()}function cancleUploadFile(){uploadStatie=3}function progressFunction(count){var progressBar=document.getElementById("progressBar");var percentageDiv=document.
